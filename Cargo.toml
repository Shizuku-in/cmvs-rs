[package]
name = "cmvs-rs"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "cmvs-inspect"
description = "Portable CMVS format research tools; not yet a game runtime"

[lib]
name = "cmvs_rs"

[[bin]]
name = "cmvs-inspect"
path = "src/main.rs"

[[bin]]
name = "cmvs-disasm"
path = "src/bin/disasm.rs"

[[bin]]
name = "cmvs-trace"
path = "src/bin/trace.rs"

[[bin]]
name = "cmvs-cpz"
path = "src/bin/cpz.rs"

[[bin]]
name = "cmvs-save"
path = "src/bin/save.rs"

[[bin]]
name = "cmvs-system-save"
path = "src/bin/system_save.rs"

[[bin]]
name = "cmvs-cursor"
path = "src/bin/cursor.rs"

[[bin]]
name = "cmvs-pb3"
path = "src/bin/pb3.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[dependencies]
encoding_rs = { version = "=0.8.42", optional = true }
ico = { version = "=0.5.0", optional = true }
softbuffer = { version = "=0.4.8", optional = true }
winit = { version = "=0.30.13", optional = true }

[features]
default = []
desktop = ["dep:winit", "dep:ico", "dep:encoding_rs", "dep:softbuffer"]

[[bin]]
name = "cmvs-desktop"
path = "src/bin/desktop.rs"
required-features = ["desktop"]
