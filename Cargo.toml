[workspace]
members = ["crates/cmvs-cli", "crates/cmvs-profile-research", "crates/cmvs-host", "crates/cmvs-core", "crates/cmvs-input", "crates/cmvs-font", "crates/cmvs-audio", "crates/cmvs-desktop", "crates/cmvs-native", "crates/cmvs-wgpu", "crates/cmvs-probe", "crates/cmvs-assembler", "crates/cmvs-disassembler", "crates/cmvs-tooling", "crates/cmvs-patch", "crates/cmvs-console", "crates/cmvs-video", "crates/cmvs-bench", "platforms/android/native", "platforms/apple/native", "platforms/web/native", "platforms/switch/player", "platforms/psvita/probe", "platforms/psvita/player"]
resolver = "3"

[workspace.package]
license = "MIT OR Apache-2.0"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
wgpu = { version = "=30.0.2", default-features = false, features = ["std", "parking_lot", "dx12", "metal", "vulkan", "wgsl"] }
pollster = "=1.0.1"
wasm-bindgen = "=0.2.130"
encoding_rs = "=0.8.44"
ico = "=0.6.0"
softbuffer = "=0.4.8"
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita-crossfont"] }
rodio = { version = "=0.23.0", default-features = false }
lewton = "=0.10.2"
png = "=0.18.1"
tempfile = { version = "=3.27.0", default-features = false }
ab_glyph = { version = "=0.2.32", default-features = false, features = ["std"] }
