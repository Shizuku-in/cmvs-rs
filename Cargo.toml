[package]
name = "cmvs-rs"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "cmvs-inspect"
description = "Portable CMVS format research tools; not yet a game runtime"

[lib]
name = "cmvs_rs"

[[bin]]
name = "cmvs-inspect"
path = "src/main.rs"

[[bin]]
name = "cmvs-disasm"
path = "src/bin/disasm.rs"

[[bin]]
name = "cmvs-trace"
path = "src/bin/trace.rs"

[[bin]]
name = "cmvs-cpz"
path = "src/bin/cpz.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
