[workspace]
members = ["crates/cmvs-core", "crates/cmvs-audio", "crates/cmvs-desktop"]
default-members = ["."]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
encoding_rs = "=0.8.42"
ico = "=0.5.0"
softbuffer = "=0.4.8"
winit = "=0.30.13"
rodio = { version = "=0.21.1", default-features = false, features = ["playback"] }
lewton = "=0.10.2"
ab_glyph = { version = "=0.2.32", default-features = false, features = ["std"] }

[package]
name = "cmvs-rs"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "cmvs-inspect"
description = "Portable CMVS format research tools; not yet a game runtime"

[lib]
name = "cmvs_rs"

[[bin]]
name = "cmvs-inspect"
path = "src/main.rs"

[[bin]]
name = "cmvs-disasm"
path = "src/bin/disasm.rs"

[[bin]]
name = "cmvs-trace"
path = "src/bin/trace.rs"

[[bin]]
name = "cmvs-cpz"
path = "src/bin/cpz.rs"

[[bin]]
name = "cmvs-save"
path = "src/bin/save.rs"

[[bin]]
name = "cmvs-system-save"
path = "src/bin/system_save.rs"

[[bin]]
name = "cmvs-cursor"
path = "src/bin/cursor.rs"

[[bin]]
name = "cmvs-pb3"
path = "src/bin/pb3.rs"

[[bin]]
name = "cmvs-cmv"
path = "src/bin/cmv.rs"

[[bin]]
name = "cmvs-audio"
path = "src/bin/audio.rs"
required-features = ["audio-output"]

[lints]
workspace = true

[dependencies]
cmvs-core = { path = "crates/cmvs-core" }
cmvs-audio = { path = "crates/cmvs-audio", optional = true }
cmvs-desktop = { path = "crates/cmvs-desktop", optional = true }

[features]
default = []
desktop = ["dep:cmvs-desktop"]
audio-output = ["dep:cmvs-audio", "cmvs-desktop?/audio-output"]

[[bin]]
name = "cmvs-desktop"
path = "src/bin/desktop.rs"
required-features = ["desktop"]
