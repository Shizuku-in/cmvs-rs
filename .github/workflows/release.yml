name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # Tag pushes do not run ci.yml, so only commits that already landed on main
  # (and passed CI there) may be released.
  verify:
    name: verify tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Tagged commit is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main"
            exit 1
          }

  # Release builds start from a clean toolchain without rust-cache, so a
  # tagged artifact never depends on state saved by an earlier run.
  switch:
    name: switch homebrew
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Keep in sync with platforms/switch/Dockerfile and ci.yml.
    container: devkitpro/devkita64@sha256:1fc388c3a0d34bd2045a6dadcb1020e069d5f876a187fd705de14b4440c00282
    env:
      RUST_TOOLCHAIN: nightly-2026-01-20
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup.sh
          sh /tmp/rustup.sh -y --profile minimal --default-toolchain "$RUST_TOOLCHAIN" --component rust-src
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "/opt/devkitpro/devkitA64/bin:/opt/devkitpro/tools/bin" >> "$GITHUB_PATH"
      - name: Build player
        env:
          TAG: ${{ github.ref_name }}
        run: CMVS_VERSION="${TAG#v}" sh platforms/switch/scripts/build-player.sh
      - name: Stage asset
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          cp platforms/switch/build/cmvs-switch.nro "dist/cmvs-switch-$TAG.nro"
      - uses: actions/upload-artifact@v7
        with:
          name: release-switch
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish release
    needs: [switch]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        # A re-run replaces the assets of the release created by an earlier
        # attempt instead of failing on the existing release.
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            prerelease=
            case "$TAG" in *-*) prerelease=--prerelease ;; esac
            gh release create "$TAG" dist/* --verify-tag --generate-notes --title "$TAG" $prerelease
          fi
