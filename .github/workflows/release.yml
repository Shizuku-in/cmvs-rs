name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # Tag pushes do not run ci.yml, so only commits that already landed on main
  # (and passed CI there) may be released.
  verify:
    name: verify tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Tagged commit is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main"
            exit 1
          }

  # Release builds start from a clean toolchain without rust-cache, so a
  # tagged artifact never depends on state saved by an earlier run.
  switch:
    name: switch homebrew
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Keep in sync with platforms/switch/Dockerfile and ci.yml.
    container: devkitpro/devkita64@sha256:1fc388c3a0d34bd2045a6dadcb1020e069d5f876a187fd705de14b4440c00282
    env:
      RUST_TOOLCHAIN: nightly-2026-01-20
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup.sh
          sh /tmp/rustup.sh -y --profile minimal --default-toolchain "$RUST_TOOLCHAIN" --component rust-src
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "/opt/devkitpro/devkitA64/bin:/opt/devkitpro/tools/bin" >> "$GITHUB_PATH"
      - name: Build player
        env:
          TAG: ${{ github.ref_name }}
        run: CMVS_VERSION="${TAG#v}" sh platforms/switch/scripts/build-player.sh
      - name: Stage asset
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          cp platforms/switch/build/cmvs-switch.nro "dist/cmvs-switch-$TAG.nro"
      - uses: actions/upload-artifact@v7
        with:
          name: release-switch
          path: dist/*
          if-no-files-found: error

  psvita:
    name: psvita homebrew
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Keep in sync with platforms/psvita/Dockerfile and ci.yml.
    container: vitasdk/vitasdk@sha256:acd15285e1ae473e925c6f83fa41e2de45eb8b9e8ba89be7df03e194c35c11d3
    env:
      RUST_TOOLCHAIN: nightly-2026-01-20
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup.sh
          sh /tmp/rustup.sh -y --profile minimal --default-toolchain "$RUST_TOOLCHAIN" --component rust-src
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "/usr/local/vitasdk/bin" >> "$GITHUB_PATH"
      - name: Build player
        env:
          TAG: ${{ github.ref_name }}
          CMVS_APP_VER: ${{ vars.CMVS_APP_VER }}
        run: CMVS_VERSION="${TAG#v}" sh platforms/psvita/scripts/build-player.sh
      - name: Stage asset
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          cp platforms/psvita/build/cmvs-vita.vpk "dist/cmvs-vita-$TAG.vpk"
      - uses: actions/upload-artifact@v7
        with:
          name: release-psvita
          path: dist/*
          if-no-files-found: error

  apple:
    name: Apple players
    needs: [verify]
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim
      - run: brew install xcodegen
      - name: Package players
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          export CMVS_VERSION="${version%%[-+]*}" CMVS_BUILD_NUMBER="$GITHUB_RUN_NUMBER"
          if ! [[ "$CMVS_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a numeric major.minor.patch version in $TAG"
            exit 1
          fi
          sh platforms/apple/build.sh macos
          sh platforms/apple/build.sh ios --reuse-framework
          for root in target/apple/macos/CMVS.app/Contents target/apple/ios/CMVS.app; do
            test "$(plutil -extract CFBundleShortVersionString raw "$root/Info.plist")" = "$CMVS_VERSION"
            test "$(plutil -extract CFBundleVersion raw "$root/Info.plist")" = "$CMVS_BUILD_NUMBER"
            notices="$root/DEPENDENCY-LICENSES.txt"
            if [ -d "$root/Resources" ]; then notices="$root/Resources/DEPENDENCY-LICENSES.txt"; fi
            grep -Fq 'Copyright (c) 2014 Mathijs van de Nes' "$notices"
          done
          mkdir -p dist target/apple/Payload
          ditto -c -k --keepParent target/apple/macos/CMVS.app "dist/cmvs-macos-$TAG.zip"
          ditto target/apple/ios/CMVS.app target/apple/Payload/CMVS.app
          ditto -c -k --keepParent target/apple/Payload "dist/cmvs-ios-$TAG.ipa"
      - uses: actions/upload-artifact@v7
        with:
          name: release-apple
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish release
    needs: [switch, psvita, apple]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        # A re-run replaces the assets of the release created by an earlier
        # attempt instead of failing on the existing release.
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            prerelease=
            case "$TAG" in *-*) prerelease=--prerelease ;; esac
            gh release create "$TAG" dist/* --verify-tag --generate-notes --title "$TAG" $prerelease
          fi
