name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR pushes are cancelled; every main push finishes so its
  # caches are saved.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # Feature-gated fallbacks are platform-independent, so the default
  # configuration is checked once.
  default:
    name: default features
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfreetype-dev libfontconfig-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Verify generated playback profiles
        run: |
          cargo run --locked --quiet -p cmvs-profile-research --bin cmvs-profile -- generate-playback > "$RUNNER_TEMP/cmvs-playback.rs"
          diff -u crates/cmvs-core/src/profile/playback/data.rs "$RUNNER_TEMP/cmvs-playback.rs"
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --locked --no-deps --lib -p cmvs-core -p cmvs-host
          cargo test --locked -p cmvs-core --doc
      - name: Check CPU-only desktop, headless CLI and no-std-fs core/host
        run: |
          cargo check --locked -p cmvs-desktop --no-default-features
          cargo check --locked -p cmvs-cli --no-default-features
          cargo check --locked -p cmvs-host --no-default-features
          core_features=$(cargo tree --locked -p cmvs-host --no-default-features --target all -i cmvs-core --depth 0 -f '{f}')
          [[ ",$core_features," != *,std-fs,* ]]
          cargo check --locked -p cmvs-core --no-default-features

  full:
    name: all features (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: windows
            os: windows-latest
          - name: macos-arm64
            os: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfreetype-dev libfontconfig-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --workspace --all-features

  macos-intel:
    name: all features (macos-x86_64)
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test native services
        run: cargo test --locked -p cmvs-native

  msrv:
    name: msrv (1.90)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfreetype-dev libfontconfig-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --locked --workspace --all-targets --all-features

  wasm:
    name: browser wasm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core
      - run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - run: cargo clippy --locked -p cmvs-web --target wasm32-unknown-unknown -- -D warnings
      - run: sh platforms/web/build.sh
      - run: node --test platforms/web/audio.test.mjs
      - run: node platforms/web/smoke.mjs

  # Host jobs compile cmvs-android as an empty crate; this checks the real
  # Android code and builds the APK.
  android:
    name: android apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Keep in sync with platforms/android/app/build.gradle.kts.
      ANDROID_NDK_VERSION: 30.0.16248370
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        run: cargo clippy --locked -p cmvs-android --target aarch64-linux-android -- -D warnings
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - name: Install NDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ANDROID_NDK_VERSION"'
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build APK
        working-directory: platforms/android
        run: sh gradlew assembleDebug -PrustAbis=arm64-v8a,x86_64
      - uses: actions/upload-artifact@v7
        with:
          name: cmvs-android
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # Host jobs only compile the off-Horizon stubs; this builds the real NRO.
  switch:
    name: switch homebrew
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Keep in sync with platforms/switch/Dockerfile.
    container: devkitpro/devkita64@sha256:1fc388c3a0d34bd2045a6dadcb1020e069d5f876a187fd705de14b4440c00282
    env:
      RUST_TOOLCHAIN: nightly-2026-01-20
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup.sh
          sh /tmp/rustup.sh -y --profile minimal --default-toolchain "$RUST_TOOLCHAIN" --component rust-src
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "/opt/devkitpro/devkitA64/bin:/opt/devkitpro/tools/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build player
        run: sh platforms/switch/scripts/build-player.sh
      - name: Build smoke test
        run: sh platforms/switch/scripts/build-smoke.sh
      - uses: actions/upload-artifact@v7
        with:
          name: cmvs-switch
          path: |
            platforms/switch/build/cmvs-switch.nro
            platforms/switch/build/cmvs-switch-smoke.nro
          if-no-files-found: error

  # Host jobs only compile the off-device stubs; this builds the real VPK.
  psvita:
    name: psvita homebrew
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Keep in sync with platforms/psvita/Dockerfile.
    container: vitasdk/vitasdk@sha256:acd15285e1ae473e925c6f83fa41e2de45eb8b9e8ba89be7df03e194c35c11d3
    env:
      RUST_TOOLCHAIN: nightly-2026-01-20
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup.sh
          sh /tmp/rustup.sh -y --profile minimal --default-toolchain "$RUST_TOOLCHAIN" --component rust-src
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "/usr/local/vitasdk/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build player
        run: sh platforms/psvita/scripts/build-player.sh
      - name: Build probe
        run: sh platforms/psvita/scripts/build-probe.sh
      - uses: actions/upload-artifact@v7
        with:
          name: cmvs-psvita
          path: |
            platforms/psvita/build/cmvs-vita.vpk
            platforms/psvita/build/cmvs-vita-probe.vpk
          if-no-files-found: error

  apple:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin,aarch64-apple-ios
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: brew install xcodegen
      - name: Clippy
        run: |
          cargo clippy --locked -p cmvs-apple -- -D warnings
          cargo clippy --locked -p cmvs-apple --target aarch64-apple-ios -- -D warnings
      - run: cargo test --locked -p cmvs-apple
      - name: Build macOS and device XCFramework
        run: sh platforms/apple/build.sh xcframework macos ios
      - name: Build macOS apps
        run: |
          sh platforms/apple/build.sh macos --reuse-framework --configuration Debug
          sh platforms/apple/build.sh macos --reuse-framework
          ditto -c -k --keepParent target/apple/macos/CMVS.app target/apple/macOS.zip
      - name: Build device app
        run: sh platforms/apple/build.sh ios --reuse-framework
      - name: Package unsigned device IPA
        working-directory: target/apple
        run: |
          mkdir -p Payload
          ditto ios/CMVS.app Payload/CMVS.app
          ditto -c -k --keepParent Payload cmvs-ios.ipa
      - uses: actions/upload-artifact@v7
        with:
          name: cmvs-ios-device
          path: target/apple/cmvs-ios.ipa
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: cmvs-apple
          path: target/apple/macOS.zip
          if-no-files-found: error

  apple-simulator:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Start iPhone simulator
        run: |
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if d["name"].startswith("iPhone")))')
          echo "SIMULATOR_UDID=$device" >> "$GITHUB_ENV"
          xcrun simctl boot "$device" || xcrun simctl bootstatus "$device" -b
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - run: brew install xcodegen
      - name: Build simulator XCFramework
        run: sh platforms/apple/build.sh xcframework ios-simulator
      - name: Build simulator app
        run: sh platforms/apple/build.sh ios-simulator --reuse-framework
      - name: Swift simulator tests
        working-directory: platforms/apple
        run: |
          xcodebuild test -scheme CmvsIOS -parallel-testing-enabled NO -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" -derivedDataPath ../../target/apple/DerivedData
      - name: Smoke test simulator app
        working-directory: platforms/apple
        run: |
          device=$SIMULATOR_UDID
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" ../../target/apple/ios-simulator/CMVS.app
          data=$(xcrun simctl get_app_container "$device" org.cmvs.player data)
          game="$data/Documents/Smoke"
          python3 tests/smoke_game.py "$game"
          cp "/System/Library/Fonts/Supplemental/Arial.ttf" "$data/Documents/smoke.ttf"
          export SIMCTL_CHILD_CMVS_GAME_DIR="$game" SIMCTL_CHILD_CMVS_PROFILE=cmvs-20160201
          export SIMCTL_CHILD_CMVS_FONT="$data/Documents/smoke.ttf" SIMCTL_CHILD_CMVS_SMOKE_FRAMES=1
          export SIMCTL_CHILD_CMVS_SMOKE_OUTPUT="$data/Documents/smoke.png"
          xcrun simctl launch --terminate-running-process "$device" org.cmvs.player
          for i in {1..60}; do
            test -s "$SIMCTL_CHILD_CMVS_SMOKE_OUTPUT" && break
            sleep 1
          done
          if ! test -s "$SIMCTL_CHILD_CMVS_SMOKE_OUTPUT" || ! swift tests/check_frame.swift "$SIMCTL_CHILD_CMVS_SMOKE_OUTPUT"; then
            xcrun simctl spawn "$device" log show --last 5m --predicate 'eventMessage CONTAINS "CMVS_SMOKE"' || true
            echo "::error::Simulator smoke test did not produce a valid logical frame"
            exit 1
          fi
      - run: ditto -c -k --keepParent target/apple/ios-simulator/CMVS.app target/apple/Simulator.zip
      - uses: actions/upload-artifact@v7
        with:
          name: cmvs-apple-simulator
          path: target/apple/Simulator.zip
          if-no-files-found: error
