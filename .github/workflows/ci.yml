name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # Feature-gated fallbacks are platform-independent, so the default
  # configuration is checked once.
  default:
    name: default features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfreetype-dev libfontconfig-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Check CPU-only desktop
        run: cargo check --locked -p cmvs-desktop --no-default-features

  full:
    name: all features (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: windows
            os: windows-latest
          - name: macos-arm64
            os: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfreetype-dev libfontconfig-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --workspace --all-features

  macos-intel:
    name: all features (macos-x86_64)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test native services
        run: cargo test --locked -p cmvs-native

  msrv:
    name: msrv (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfreetype-dev libfontconfig-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --locked --workspace --all-targets --all-features

  python-tools:
    name: python tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run synthetic tool tests
        run: |
          for test in tools/test_*.py; do
            echo "::group::$test"
            python -I "$test"
            echo "::endgroup::"
          done

  wasm:
    name: browser wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core
      - run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - run: cargo clippy --locked -p cmvs-web --target wasm32-unknown-unknown -- -D warnings
      - run: sh platforms/web/build.sh
      - run: node --test platforms/web/audio.test.mjs
      - run: node platforms/web/smoke.mjs

  # Host jobs compile cmvs-android as an empty crate; this checks the real
  # Android code and builds the APK.
  android:
    name: android apk
    runs-on: ubuntu-latest
    env:
      # Keep in sync with platforms/android/app/build.gradle.kts.
      ANDROID_NDK_VERSION: 30.0.16248370
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        run: cargo clippy --locked -p cmvs-android --target aarch64-linux-android -- -D warnings
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - name: Install NDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ANDROID_NDK_VERSION"'
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build APK
        working-directory: platforms/android
        run: sh gradlew assembleDebug -PrustAbis=arm64-v8a,x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: cmvs-android
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # Host jobs only compile the off-Horizon stubs; this builds the real NRO.
  switch:
    name: switch homebrew
    runs-on: ubuntu-latest
    # Keep in sync with platforms/switch/Dockerfile.
    container: devkitpro/devkita64@sha256:1fc388c3a0d34bd2045a6dadcb1020e069d5f876a187fd705de14b4440c00282
    env:
      RUST_TOOLCHAIN: nightly-2026-01-20
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup.sh
          sh /tmp/rustup.sh -y --profile minimal --default-toolchain "$RUST_TOOLCHAIN" --component rust-src
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "/opt/devkitpro/devkitA64/bin:/opt/devkitpro/tools/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build player
        run: sh platforms/switch/scripts/build-player.sh
      - name: Build smoke test
        run: sh platforms/switch/scripts/build-smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: cmvs-switch
          path: |
            platforms/switch/build/cmvs-switch.nro
            platforms/switch/build/cmvs-switch-smoke.nro
          if-no-files-found: error
