[package]
license.workspace = true
name = "cmvs-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "CMVS desktop window, native input adapter and application entry point"

[lints]
workspace = true

[dependencies]
cmvs-wgpu = { path = "../cmvs-wgpu", optional = true }
cmvs-core = { path = "../cmvs-core" }
ogg = "=0.9.2"
oxideav-theora = "=0.0.12"
oxideav-core = "=0.1.41"
cmvs-input = { path = "../cmvs-input" }
cmvs-font = { path = "../cmvs-font" }
cmvs-audio = { path = "../cmvs-audio", optional = true }
encoding_rs.workspace = true
ico.workspace = true
softbuffer.workspace = true
winit.workspace = true
cmvs-native = { path = "../cmvs-native" }

[features]
default = []
audio-output = ["dep:cmvs-audio"]

wgpu-renderer = ["dep:cmvs-wgpu"]
