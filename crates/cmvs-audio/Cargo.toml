[package]
license.workspace = true
name = "cmvs-audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Optional CMVS streaming Vorbis decoder, software mixer and native audio backend"

[lints]
workspace = true

[dependencies]
cmvs-core = { path = "../cmvs-core" }
rodio = { workspace = true, optional = true }
lewton.workspace = true

[features]
default = ["native"]
# Engine channel state and software mixing; the host pulls PCM (no OS audio device).
mixer = ["dep:rodio"]
# Mixer output through the default system device.
native = ["mixer", "rodio/playback"]
